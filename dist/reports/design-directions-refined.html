<!doctype html>

  <style>
    *{box-sizing:border-box}html{scroll-padding-top:82px}body{margin:0;background:#111211;color:#eeeae1;font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}a{color:inherit}a:focus-visible{outline:3px solid #d6bb7c;outline-offset:5px}header{position:sticky;top:0;z-index:1;background:#111211f5;border-bottom:1px solid #353730;backdrop-filter:blur(12px)}.bar{max-width:1380px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-size:13px;color:#bdb6a5}nav{display:flex;gap:8px}nav a{display:grid;place-items:center;min-width:48px;min-height:44px;text-decoration:none;border:1px solid #4a4b40;border-radius:6px}nav a:hover{background:#2b2c25}main{max-width:1380px;margin:auto;padding:32px 24px 48px}h1{font-size:clamp(24px,4vw,36px);line-height:1.25;margin:0 0 12px}main>p{margin:0 0 32px;color:#beb9ad}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}article{min-width:0;scroll-margin-top:12px}h2{font-size:18px;margin:0 0 4px}.description{font-size:14px;color:#bcb5a7;margin:0 0 14px}.art{display:block;overflow:hidden;background:#22231f;border:1px solid #414238;border-radius:8px}.art img{display:block;width:100%;height:auto}.full{display:flex;align-items:center;justify-content:center;min-height:48px;gap:8px;margin-top:10px;border:1px solid #53523f;border-radius:6px;color:#e6d6af;text-decoration:none}.full:hover{background:#28291f}footer{margin-top:36px;color:#a7a398;font-size:14px}@media(max-width:760px){.bar{padding:10px 16px}main{padding:28px 16px 40px}.gallery{grid-template-columns:1fr;gap:36px}.gallery article{max-width:480px;width:100%;margin-inline:auto}.brand{font-size:12px}main>p{margin-bottom:24px}}
  </style>
</head>
<body>
  <header><div class="bar"><span class="brand">UNDERHIVE KOREA · DESIGN</span><nav aria-label="시안 바로가기"><a href="#design-1" aria-label="1번 시안으로 이동">1번</a><a href="#design-2" aria-label="2번 시안으로 이동">2번</a><a href="#design-3" aria-label="3번 시안으로 이동">3번</a></nav></div></header>
  <main>
    <h1>장식을 줄인 UI 시안 3종</h1>
    <p>질감과 큰 일러스트를 빼고, 정보와 조작에 집중했습니다. 이미지를 누르면 전체 이미지을 크게 볼 수 있습니다.</p>
    <div class="gallery">
      <article id="design-1">
        <h2>1번 · 차분한 다크</h2><p class="description">짙은 바탕, 옅은 황동색, 단정한 간격</p>
        <a class="art" href="./design-directions-refined/quiet-graphite.webp" aria-label="1번 차분한 다크 전체 이미지 이미지 보기"><img src="./design-directions-refined/quiet-graphite.webp" alt="1번 시안: 차분한 다크 스타일의 전투 로스터" width="853" height="1844" fetchpriority="high"></a>
        <a class="full" href="./design-directions-refined/quiet-graphite.webp">1번 크게 보기 <span aria-hidden="true">↗</span></a>
      </article>
      <article id="design-2">
        <h2>2번 · 담백한 라이트</h2><p class="description">밝은 바탕, 잔잔한 강조색, 통합 무기 표</p>
        <a class="art" href="./design-directions-refined/stone-field-notes.webp" aria-label="2번 담백한 라이트 전체 이미지 이미지 보기"><img src="./design-directions-refined/stone-field-notes.webp" alt="2번 시안: 밝고 담백한 스타일의 전투 로스터" width="853" height="1844" loading="lazy"></a>
        <a class="full" href="./design-directions-refined/stone-field-notes.webp">2번 크게 보기 <span aria-hidden="true">↗</span></a>
      </article>
      <article id="design-3">
        <h2>3번 · 간결한 목록형</h2><p class="description">차분한 슬레이트, 유닛별 펼침 목록</p>
        <a class="art" href="./design-directions-refined/compact-roster.webp" aria-label="3번 간결한 목록형 전체 이미지 이미지 보기"><img src="./design-directions-refined/compact-roster.webp" alt="3번 시안: 유닛별 펼침 목록을 적용한 전투 로스터" width="853" height="1844" loading="lazy"></a>
        <a class="full" href="./design-directions-refined/compact-roster.webp">3번 크게 보기 <span aria-hidden="true">↗</span></a>

    </div>
    <footer>비교용 이미지 시안입니다. 마음에 드는 번호나 조합을 대화에서 알려주세요.</footer>
